# Local reverse proxy for Sharm Station Viaggi. Installed by deploy/setup-local-sudo.sh.
#   http://sharm-station.loc            -> Next.js site   (127.0.0.1:3000, `npm run start -- --port 3000`)
#   http://api.sharm-station.loc        -> Laravel API    (127.0.0.1:8090, `php artisan serve --port=8090`)
#   http://admin.sharm-station.loc/admin -> same Laravel app (admin panel)
# Needs: a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName sharm-station.loc
    ServerAlias www.sharm-station.loc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:3000/ keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/sharm-station.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/sharm-station.loc_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName api.sharm-station.loc
    ServerAlias admin.sharm-station.loc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:8090/ keepalive=On
    ProxyPassReverse / http://127.0.0.1:8090/

    # payment proof uploads (3 x 5 MB) and admin media
    LimitRequestBody 33554432

    ErrorLog ${APACHE_LOG_DIR}/api.sharm-station.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/api.sharm-station.loc_access.log combined
</VirtualHost>
